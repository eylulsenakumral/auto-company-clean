# binding ***REMOVED*** "EMAIL_QUEUE"
# queue ***REMOVED*** "email-jobs"

# [[queues.consumers]]
# queue ***REMOVED*** "email-jobs"
# max_batch_size ***REMOVED*** 10
# max_wait_time_ms ***REMOVED*** 5000

