name ***REMOVED*** "nextvision-outreach"
main ***REMOVED*** "src/workers/index.ts"
compatibility_date ***REMOVED*** "2024-01-01"
account_id ***REMOVED*** "YOUR_CLOUDFLARE_ACCOUNT_ID"

# Cron triggers - Turkey timezone (UTC+3)
[triggers]
crons ***REMOVED*** ["0 5 * * *"]  # 8:00 AM Turkey time (UTC+3 ***REMOVED*** 5:00 AM UTC)

