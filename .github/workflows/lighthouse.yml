name: Lighthouse CI

on:
  schedule:
    # Every Monday at 9 AM UTC
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      url:
        description: "URL to run Lighthouse against"
        required: false
        default: "https://auto-company.com"

jobs:
  lighthouse:
    name: Run Lighthouse CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v10
        with:
          # Only run if URL is available (not during initial setup)
          urls: |
            ${{ inputs.url || 'https://auto-company.com' }}
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Comment results on PR (if applicable)
        if: github.event_name  'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs  require('fs');
            const report  fs.readFileSync('./lighthouse-results.json', 'utf8');
            // Add PR comment with results
