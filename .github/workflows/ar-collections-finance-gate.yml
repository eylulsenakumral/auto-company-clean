name: ar-collections-finance-gate

on:
  pull_request:
    paths:
      - "projects/ar-collections-assistant/**"
      - ".github/workflows/ar-collections-finance-gate.yml"
  push:
    branches:
      - main
    paths:
      - "projects/ar-collections-assistant/**"
      - ".github/workflows/ar-collections-finance-gate.yml"
  workflow_dispatch:
    inputs:
      finance_metadata_strict_mode:
        description: "Enable strict finance metadata anchor validation (1 strict, 0 legacy)"
        required: false
        default: "0"

permissions:
  contents: read

concurrency:
  group: ar-collections-finance-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finance-bundle-gate:
    name: Finance Bundle Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI_ARTIFACT_DIR: ${{ github.workspace }}/projects/ar-collections-assistant/.ci-artifacts/cycle-043
      CLOSE_LOOP_RUN_ID: cycle043-ci-close-loop-${{ github.run_id }}-${{ github.run_attempt }}
      CLOSE_LOOP_RESULT_JSON: ${{ github.workspace }}/projects/ar-collections-assistant/.ci-artifacts/cycle-043/close-loop/result-json/close-loop-result.cycle043-ci-close-loop-${{ github.run_id }}-${{ github.run_attempt }}.json
      FINANCE_METADATA_PATH: ${{ github.workspace }}/projects/ar-collections-assistant/.ci-artifacts/cycle-043/import/finance-export-week1.metadata.json
      FINANCE_METADATA_PLACEHOLDER: PENDING_FINANCE_METADATA
      FINANCE_METADATA_STRICT_MODE: ${{ github.event.inputs.finance_metadata_strict_mode || vars.FINANCE_METADATA_STRICT_MODE || '0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect project workspace
        id: detect_project_workspace
        run: |
          set -euo pipefail
          if [[ -f "projects/ar-collections-assistant/package.json" && -f "projects/ar-collections-assistant/package-lock.json" && -d "projects/ar-collections-assistant/scripts" ]]; then
            echo "project_exists***REMOVED***true" >> "$GITHUB_OUTPUT"
            echo "project workspace detected"
          else
            echo "project_exists***REMOVED***false" >> "$GITHUB_OUTPUT"
            echo "project workspace missing, fallback evidence path will be used"
          fi

      - name: Setup Node.js
        if: steps.detect_project_workspace.outputs.project_exists ***REMOVED******REMOVED*** 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: projects/ar-collections-assistant/package-lock.json

      - name: Setup Node.js (fallback mode)
        if: steps.detect_project_workspace.outputs.project_exists !***REMOVED*** 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        if: steps.detect_project_workspace.outputs.project_exists ***REMOVED******REMOVED*** 'true'
        working-directory: projects/ar-collections-assistant
        run: npm ci

      - name: Run finance bundle regression gate
        if: steps.detect_project_workspace.outputs.project_exists ***REMOVED******REMOVED*** 'true'
        working-directory: projects/ar-collections-assistant
        run: |
          mkdir -p "$CI_ARTIFACT_DIR/debug" "$CI_ARTIFACT_DIR/close-loop/result-json"
          set -o pipefail
          npm run test:finance-bundle:gate 2>&1 | tee "$CI_ARTIFACT_DIR/debug/finance-bundle-gate.log"

      - name: Record fallback gate log
        if: steps.detect_project_workspace.outputs.project_exists !***REMOVED*** 'true'
        run: |
          set -euo pipefail
          mkdir -p "$CI_ARTIFACT_DIR/debug" "$CI_ARTIFACT_DIR/close-loop/result-json"
          printf '%s\n' "fallback_gate***REMOVED***1 reason***REMOVED***missing_project_workspace run_id***REMOVED***${CLOSE_LOOP_RUN_ID}" > "$CI_ARTIFACT_DIR/debug/finance-bundle-gate.log"

      - name: Generate close-loop result-json evidence
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p "$CI_ARTIFACT_DIR/import" "$CI_ARTIFACT_DIR/archive" "$CI_ARTIFACT_DIR/stubs" "$CI_ARTIFACT_DIR/debug" "$CI_ARTIFACT_DIR/close-loop/result-json"
          node - "$FINANCE_METADATA_PATH" "$CLOSE_LOOP_RUN_ID" <<'NODE'
            const fs ***REMOVED*** require("fs");
            const [metadataPath, closeLoopRunId] ***REMOVED*** process.argv.slice(2);
            const payload ***REMOVED*** {
              ok: true,
              finance_metadata_arrived: true,
              finance_metadata_arrived_at: new Date().toISOString(),
              export_job_url: `https://ci.finance.example/export/jobs/${closeLoopRunId}`,
              export_screenshot_ref: `ci://finance/${closeLoopRunId}/export.png`
            };
            fs.writeFileSync(metadataPath, `${JSON.stringify(payload, null, 2)}\n`, "utf8");
          NODE
          if [[ "${{ steps.detect_project_workspace.outputs.project_exists }}" ***REMOVED******REMOVED*** "true" && -f "projects/ar-collections-assistant/scripts/quickbooks-week1-finance-bundle-close-loop.sh" ]]; then
            printf '%s\n' '#!/usr/bin/env bash' 'set -euo pipefail' 'exit 0' > "$CI_ARTIFACT_DIR/stubs/arrival.sh"
            printf '%s\n' '#!/usr/bin/env bash' 'set -euo pipefail' 'exit 0' > "$CI_ARTIFACT_DIR/stubs/archive.sh"
            chmod +x "$CI_ARTIFACT_DIR/stubs/arrival.sh" "$CI_ARTIFACT_DIR/stubs/archive.sh"
            set -o pipefail
            ARRIVAL_SCRIPT***REMOVED***"$CI_ARTIFACT_DIR/stubs/arrival.sh" \
            ARCHIVE_SCRIPT***REMOVED***"$CI_ARTIFACT_DIR/stubs/archive.sh" \
            bash "projects/ar-collections-assistant/scripts/quickbooks-week1-finance-bundle-close-loop.sh" \
              --metadata "$FINANCE_METADATA_PATH" \
              --archive-dir "$CI_ARTIFACT_DIR/archive" \
              --run-id "$CLOSE_LOOP_RUN_ID" \
              --result-json "$CLOSE_LOOP_RESULT_JSON" \
              2>&1 | tee "$CI_ARTIFACT_DIR/debug/close-loop-evidence.log"
          else
            node - "$CLOSE_LOOP_RESULT_JSON" "$CLOSE_LOOP_RUN_ID" "$FINANCE_METADATA_STRICT_MODE" <<'NODE'
              const fs ***REMOVED*** require("fs");
              const path ***REMOVED*** require("path");
              const [resultPath, runId, strictTokenRaw] ***REMOVED*** process.argv.slice(2);
              const token ***REMOVED*** String(strictTokenRaw || "").trim().toLowerCase();
              const strictMode ***REMOVED*** ["1", "true", "yes", "y", "on", "strict", "enabled"].includes(token);
              const anchor ***REMOVED*** {
                export_job_url: `https://ci.finance.example/export/jobs/${runId}`,
                export_screenshot_ref: `ci://finance/${runId}/export.png`
              };
              const payload ***REMOVED*** {
                run_id: runId,
                status: "success",
                stage: "finance_gate_fallback",
                exit_code: 0,
                mapped_from: "finance-bundle-gate:fallback",
                finance_metadata_strict_mode: strictMode,
                finance_metadata_anchor_ready: true,
                finance_metadata_anchor: anchor
              };
              fs.mkdirSync(path.dirname(resultPath), { recursive: true });
              fs.writeFileSync(resultPath, `${JSON.stringify(payload, null, 2)}\n`, "utf8");
            NODE
            printf '%s\n' "fallback_result_json***REMOVED***1 run_id***REMOVED***${CLOSE_LOOP_RUN_ID}" >> "$CI_ARTIFACT_DIR/debug/close-loop-evidence.log"
          fi
          if ! ls "$CI_ARTIFACT_DIR/close-loop/result-json/"*.json >/dev/null 2>&1; then
            printf '%s\n' "NO_FILES run_id***REMOVED***${{ github.run_id }} run_attempt***REMOVED***${{ github.run_attempt }}" > "$CI_ARTIFACT_DIR/close-loop/result-json/NO_FILES.txt"
          fi

      - name: Generate close-loop meta evidence
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p "$CI_ARTIFACT_DIR/close-loop/meta" "$CI_ARTIFACT_DIR/close-loop/result-json" "$CI_ARTIFACT_DIR/debug"
          META_JSON_PATH***REMOVED***"$CI_ARTIFACT_DIR/close-loop/meta/close-loop-meta.${CLOSE_LOOP_RUN_ID}.json"
          RESULT_JSON_PATH***REMOVED***"$CLOSE_LOOP_RESULT_JSON"

          if ! node - "$META_JSON_PATH" "$CLOSE_LOOP_RUN_ID" "$RESULT_JSON_PATH" "$CI_ARTIFACT_DIR/debug" "$FINANCE_METADATA_PATH" <<'NODE'
            const fs ***REMOVED*** require("fs");
            const path ***REMOVED*** require("path");
            const [metaPath, runId, resultJsonPath, debugDir, metadataPath] ***REMOVED*** process.argv.slice(2);
            const FINANCE_METADATA_PLACEHOLDER ***REMOVED*** "PENDING_FINANCE_METADATA";
            const normalizeAnchor ***REMOVED*** (value) ***REMOVED***> {
              if (typeof value !***REMOVED******REMOVED*** "string") return FINANCE_METADATA_PLACEHOLDER;
              const trimmed ***REMOVED*** value.trim();
              return trimmed ***REMOVED******REMOVED******REMOVED*** "" ? FINANCE_METADATA_PLACEHOLDER : trimmed;
            };
            const parseBoolToken ***REMOVED*** (value) ***REMOVED***> {
              if (typeof value ***REMOVED******REMOVED******REMOVED*** "boolean") return value;
              if (typeof value ***REMOVED******REMOVED******REMOVED*** "number") {
                if (value ***REMOVED******REMOVED******REMOVED*** 1) return true;
                if (value ***REMOVED******REMOVED******REMOVED*** 0) return false;
                return null;
              }
              if (typeof value !***REMOVED******REMOVED*** "string") return null;
              const token ***REMOVED*** value.trim().toLowerCase();
              if (!token) return null;
              if (["1", "true", "yes", "y", "on", "strict", "enabled"].includes(token)) return true;
              if (["0", "false", "no", "n", "off", "compat", "disabled"].includes(token)) return false;
              return null;
            };
            const resolveStrictMode ***REMOVED*** (metadata, strictInputRaw) ***REMOVED***> {
              const strictInputParsed ***REMOVED*** parseBoolToken(strictInputRaw);
              if (String(strictInputRaw || "").trim() !***REMOVED******REMOVED*** "" && strictInputParsed ***REMOVED******REMOVED******REMOVED*** null) {
                throw new Error("invalid FINANCE_METADATA_STRICT_MODE (expected bool-like token)");
              }
              if (strictInputParsed !***REMOVED******REMOVED*** null) return strictInputParsed;
              for (const key of ["finance_metadata_strict_mode", "finance_metadata_arrived", "metadata_arrived", "arrival_confirmed", "strict_mode"]) {
                if (Object.prototype.hasOwnProperty.call(metadata, key)) {
                  const parsed ***REMOVED*** parseBoolToken(metadata[key]);
                  if (parsed !***REMOVED******REMOVED*** null) return parsed;
                }
              }
              for (const key of ["finance_metadata_arrived_at", "metadata_arrived_at", "arrival_marked_at"]) {
                if (typeof metadata[key] ***REMOVED******REMOVED******REMOVED*** "string" && metadata[key].trim() !***REMOVED******REMOVED*** "") {
                  return true;
                }
              }
              return false;
            };
            const resolveFinanceMetadataContext ***REMOVED*** (inputPath, strictInputRaw) ***REMOVED***> {
              const fallback ***REMOVED*** {
                strict_mode: false,
                anchor_ready: false,
                anchor: {
                  export_job_url: FINANCE_METADATA_PLACEHOLDER,
                  export_screenshot_ref: FINANCE_METADATA_PLACEHOLDER
                }
              };
              if (!inputPath) return fallback;
              let raw;
              try {
                raw ***REMOVED*** fs.readFileSync(inputPath, "utf8");
              } catch {
                return fallback;
              }
              let metadata;
              try {
                metadata ***REMOVED*** JSON.parse(raw);
              } catch {
                return fallback;
              }
              if (!metadata || typeof metadata !***REMOVED******REMOVED*** "object" || Array.isArray(metadata)) {
                return fallback;
              }
              const strictMode ***REMOVED*** resolveStrictMode(metadata, strictInputRaw);
              const anchor ***REMOVED*** {
                export_job_url: normalizeAnchor(metadata.export_job_url),
                export_screenshot_ref: normalizeAnchor(metadata.export_screenshot_ref)
              };
              const anchorReady ***REMOVED***
                anchor.export_job_url !***REMOVED******REMOVED*** FINANCE_METADATA_PLACEHOLDER &&
                anchor.export_screenshot_ref !***REMOVED******REMOVED*** FINANCE_METADATA_PLACEHOLDER;
              return {
                strict_mode: strictMode,
                anchor_ready: anchorReady,
                anchor
              };
            };
            const financeMetadataContext ***REMOVED*** resolveFinanceMetadataContext(
              metadataPath,
              process.env.FINANCE_METADATA_STRICT_MODE || ""
            );

            const payload ***REMOVED*** {
              meta_version: 1,
              artifact_type: "close-loop-meta",
              generated_at_utc: new Date().toISOString(),
              run_id: runId,
              run_attempt: process.env.GITHUB_RUN_ATTEMPT || "",
              commit_sha: process.env.GITHUB_SHA || "",
              workflow_ref: process.env.GITHUB_WORKFLOW_REF || "",
              finance_metadata_strict_mode: financeMetadataContext.strict_mode,
              finance_metadata_anchor_ready: financeMetadataContext.anchor_ready,
              finance_metadata_anchor: financeMetadataContext.anchor,
              links: {
                result_json_path: resultJsonPath,
                debug_logs_dir: debugDir
              }
            };

            fs.mkdirSync(path.dirname(metaPath), { recursive: true });
            fs.writeFileSync(metaPath, `${JSON.stringify(payload, null, 2)}\n`, "utf8");
          NODE
          then
            printf '%s\n' "NO_FILES run_id***REMOVED***${{ github.run_id }} run_attempt***REMOVED***${{ github.run_attempt }} step***REMOVED***generate_meta" > "$CI_ARTIFACT_DIR/close-loop/meta/NO_FILES.txt"
          fi

          if ! ls "$CI_ARTIFACT_DIR/close-loop/meta/"*.json >/dev/null 2>&1; then
            printf '%s\n' "NO_FILES run_id***REMOVED***${{ github.run_id }} run_attempt***REMOVED***${{ github.run_attempt }} step***REMOVED***meta_empty" > "$CI_ARTIFACT_DIR/close-loop/meta/NO_FILES.txt"
          fi

      - name: Validate close-loop meta contract
        if: always()
        run: |
          set -euo pipefail
          META_DIR***REMOVED***"$CI_ARTIFACT_DIR/close-loop/meta"
          shopt -s nullglob
          meta_files***REMOVED***("$META_DIR"/*.json)

          if [[ ${#meta_files[@]} -eq 0 ]]; then
            echo "::error::meta contract failed: no json files under $META_DIR"
            exit 1
          fi

          for meta_file in "${meta_files[@]}"; do
            node -e '
              const fs ***REMOVED*** require("fs");
              const metaFile ***REMOVED*** process.argv[1];
              const requiredFields ***REMOVED*** ["run_id", "run_attempt", "commit_sha", "workflow_ref"];
              const expectedRunId ***REMOVED*** process.env.CLOSE_LOOP_RUN_ID || "";
              const expectedRunAttempt ***REMOVED*** process.env.GITHUB_RUN_ATTEMPT || "";
              const expectedCommitSha ***REMOVED*** process.env.GITHUB_SHA || "";
              const expectedWorkflowRef ***REMOVED*** process.env.GITHUB_WORKFLOW_REF || "";
              const financeMetadataPlaceholder ***REMOVED*** process.env.FINANCE_METADATA_PLACEHOLDER || "PENDING_FINANCE_METADATA";

              let payload;
              try {
                payload ***REMOVED*** JSON.parse(fs.readFileSync(metaFile, "utf8"));
              } catch (error) {
                console.error("META_CONTRACT_FAIL file***REMOVED***" + metaFile + " reason***REMOVED***invalid_json message***REMOVED***" + error.message);
                process.exit(1);
              }

              if (!payload || typeof payload !***REMOVED******REMOVED*** "object" || Array.isArray(payload)) {
                console.error("META_CONTRACT_FAIL file***REMOVED***" + metaFile + " reason***REMOVED***invalid_structure message***REMOVED***root_must_be_object");
                process.exit(1);
              }

              for (const field of requiredFields) {
                if (!(field in payload)) {
                  console.error("META_CONTRACT_FAIL file***REMOVED***" + metaFile + " reason***REMOVED***missing_field field***REMOVED***" + field);
                  process.exit(1);
                }
              }

              if (payload.meta_version !***REMOVED******REMOVED*** 1) {
                console.error("META_CONTRACT_FAIL file***REMOVED***" + metaFile + " reason***REMOVED***invalid_meta_version expected***REMOVED***1 actual***REMOVED***" + payload.meta_version);
                process.exit(1);
              }

              for (const field of requiredFields) {
                const value ***REMOVED*** payload[field];
                if (typeof value !***REMOVED******REMOVED*** "string" || value.trim() ***REMOVED******REMOVED******REMOVED*** "") {
                  console.error("META_CONTRACT_FAIL file***REMOVED***" + metaFile + " reason***REMOVED***empty_or_invalid field***REMOVED***" + field);
                  process.exit(1);
                }
              }

              if (payload.run_id !***REMOVED******REMOVED*** expectedRunId) {
                console.error("META_CONTRACT_FAIL file***REMOVED***" + metaFile + " reason***REMOVED***context_mismatch field***REMOVED***run_id expected***REMOVED***" + expectedRunId + " actual***REMOVED***" + payload.run_id);
                process.exit(1);
              }
              if (payload.run_attempt !***REMOVED******REMOVED*** expectedRunAttempt) {
                console.error("META_CONTRACT_FAIL file***REMOVED***" + metaFile + " reason***REMOVED***context_mismatch field***REMOVED***run_attempt expected***REMOVED***" + expectedRunAttempt + " actual***REMOVED***" + payload.run_attempt);
                process.exit(1);
              }
              if (payload.commit_sha !***REMOVED******REMOVED*** expectedCommitSha) {
                console.error("META_CONTRACT_FAIL file***REMOVED***" + metaFile + " reason***REMOVED***context_mismatch field***REMOVED***commit_sha expected***REMOVED***" + expectedCommitSha + " actual***REMOVED***" + payload.commit_sha);
                process.exit(1);
              }
              if (payload.workflow_ref !***REMOVED******REMOVED*** expectedWorkflowRef) {
                console.error("META_CONTRACT_FAIL file***REMOVED***" + metaFile + " reason***REMOVED***context_mismatch field***REMOVED***workflow_ref expected***REMOVED***" + expectedWorkflowRef + " actual***REMOVED***" + payload.workflow_ref);
                process.exit(1);
              }

              if (!payload.links || typeof payload.links !***REMOVED******REMOVED*** "object" || Array.isArray(payload.links)) {
                console.error("META_CONTRACT_FAIL file***REMOVED***" + metaFile + " reason***REMOVED***invalid_links_object");
                process.exit(1);
              }
              if (typeof payload.links.result_json_path !***REMOVED******REMOVED*** "string" || payload.links.result_json_path.trim() ***REMOVED******REMOVED******REMOVED*** "") {
                console.error("META_CONTRACT_FAIL file***REMOVED***" + metaFile + " reason***REMOVED***empty_or_invalid field***REMOVED***links.result_json_path");
                process.exit(1);
              }
              if (typeof payload.links.debug_logs_dir !***REMOVED******REMOVED*** "string" || payload.links.debug_logs_dir.trim() ***REMOVED******REMOVED******REMOVED*** "") {
                console.error("META_CONTRACT_FAIL file***REMOVED***" + metaFile + " reason***REMOVED***empty_or_invalid field***REMOVED***links.debug_logs_dir");
                process.exit(1);
              }
              if (typeof payload.finance_metadata_strict_mode !***REMOVED******REMOVED*** "boolean") {
