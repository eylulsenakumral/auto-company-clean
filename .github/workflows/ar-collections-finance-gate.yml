              } catch (error) {
                console.error("CONTRACT_FAIL file***REMOVED***" + resultFile + " reason***REMOVED***invalid_json message***REMOVED***" + error.message);
                process.exit(1);
              }

              if (!payload || typeof payload !***REMOVED******REMOVED*** "object" || Array.isArray(payload)) {
