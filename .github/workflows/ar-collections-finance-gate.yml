                process.exit(1);
              }

              for (const field of requiredFields) {
                if (!(field in payload)) {
                  console.error("CONTRACT_FAIL file***REMOVED***" + resultFile + " reason***REMOVED***missing_field field***REMOVED***" + field);
                  process.exit(1);
                }
              }

              for (const field of ["run_id", "status", "stage", "mapped_from"]) {
                const value ***REMOVED*** payload[field];
                if (typeof value !***REMOVED******REMOVED*** "string" || value.trim() ***REMOVED******REMOVED******REMOVED*** "") {
                  console.error("CONTRACT_FAIL file***REMOVED***" + resultFile + " reason***REMOVED***empty_or_invalid field***REMOVED***" + field);
                  process.exit(1);
                }
              }

              if (!Number.isFinite(payload.exit_code)) {
                console.error("CONTRACT_FAIL file***REMOVED***" + resultFile + " reason***REMOVED***empty_or_invalid field***REMOVED***exit_code");
                process.exit(1);
              }
              if (typeof payload.finance_metadata_strict_mode !***REMOVED******REMOVED*** "boolean") {
                console.error("CONTRACT_FAIL file***REMOVED***" + resultFile + " reason***REMOVED***invalid_type field***REMOVED***finance_metadata_strict_mode expected***REMOVED***boolean");
                process.exit(1);
              }
              if (typeof payload.finance_metadata_anchor_ready !***REMOVED******REMOVED*** "boolean") {
                console.error("CONTRACT_FAIL file***REMOVED***" + resultFile + " reason***REMOVED***invalid_type field***REMOVED***finance_metadata_anchor_ready expected***REMOVED***boolean");
